[package]
name = "stormdrain"
version = "0.1.3"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["Joe Borg <joe@josephb.org>"]
description = "A BitTorrent CLI and client library"

[dependencies]
tokio = { version = "1.54.1", features = ["full"] }
bytes = "1"
sha1 = "0.11"
rand = "0.10.3"
hex = "0.4"
url = "2"
reqwest = { version = "0.13", default-features = false, features = [
    "rustls",
    "stream",
] }
thiserror = "2.0.21"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
num-bigint = "0.5"
clap = { version = "4.6.7", features = ["derive"] }
indicatif = "0.18.6"
anyhow = "1.0.104"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
